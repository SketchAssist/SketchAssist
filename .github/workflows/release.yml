name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend / electron (TypeScript)
        run: pnpm run build

      - name: Install Python build dependencies
        working-directory: packages/python-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        working-directory: packages/python-sidecar
        run: bash build_sidecar.sh

      - name: Build & publish (Linux)
        working-directory: packages/electron
        run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    needs: release-linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend / electron (TypeScript)
        run: pnpm run build

      - name: Install Python build dependencies
        working-directory: packages/python-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        working-directory: packages/python-sidecar
        run: bash build_sidecar.sh

      - name: Build & publish (macOS)
        working-directory: packages/electron
        run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend / electron (TypeScript)
        run: pnpm run build

      - name: Install Python build dependencies
        working-directory: packages/python-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        working-directory: packages/python-sidecar
        run: .\build_sidecar.ps1

      - name: Build & publish (Windows)
        working-directory: packages/electron
        run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
