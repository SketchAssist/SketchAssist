name: Release

# タグ (v1.0.0 のような "v" で始まるもの) をpushしたときにだけ実行される。
# 通常のコミットやプルリクエストでは実行されない。
on:
  push:
    tags:
      - "v*"

# electron-builder が GitHub Releases の作成・アップロードを行うために必要な権限。
permissions:
  contents: write

jobs:
  # ── Linux ──────────────────────────────────────────────────────
  # 3プラットフォームを並列ではなく順番(linux → mac → windows)に実行し、
  # 同じドラフトリリースへの同時書き込みによる競合を避ける。
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend / electron (TypeScript)
        run: pnpm run build

      - name: Install Python build dependencies
        working-directory: packages/python-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        working-directory: packages/python-sidecar
        run: bash build_sidecar.sh

      - name: Build & publish (Linux)
        working-directory: packages/electron
        run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ──────────────────────────────────────────────────────
  release-mac:
    needs: release-linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend / electron (TypeScript)
        run: pnpm run build

      - name: Install Python build dependencies
        working-directory: packages/python-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        working-directory: packages/python-sidecar
        run: bash build_sidecar.sh

      - name: Build & publish (macOS)
        working-directory: packages/electron
        run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows ────────────────────────────────────────────────────
  release-windows:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend / electron (TypeScript)
        run: pnpm run build

      - name: Install Python build dependencies
        working-directory: packages/python-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        working-directory: packages/python-sidecar
        run: .\build_sidecar.ps1

      - name: Build & publish (Windows)
        working-directory: packages/electron
        run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
