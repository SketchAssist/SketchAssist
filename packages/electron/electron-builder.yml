appId: com.sketchassist.app
productName: SketchAssist
copyright: Copyright © 2026 SketchAssist

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

# ── 追加リソース ──────────────────────────────────────────────────
#
# pipeline-defaults/ について:
#   Electron の main.ts は初回起動時に pipeline-defaults/ を
#   userData/pipeline/ へコピーする。ユーザーはここからファイルを
#   上書きして、アプリ内の「パイプライン」ページで管理できる。
#
#   ビルド前に必要な作業:
#     cd packages/python-sidecar
#     bash build_sidecar.sh    (Linux/macOS)
#     .\build_sidecar.ps1      (Windows)
#   → dist/sidecar/ が生成される
#
extraResources:
  # React フロントエンド
  - from: ../../artifacts/sketchassist/dist
    to: renderer
    filter: ["**/*"]

  # Python サイドカー（PyInstaller --onedir バイナリ）
  # 実行ファイル: resources/sidecar/sidecar(.exe)
  - from: ../../packages/python-sidecar/dist/sidecar
    to: sidecar
    filter: ["**/*"]

  # パイプラインファイルのデフォルト（.py / .yaml ソース）
  # 初回起動時に userData/pipeline/ へコピーされる。
  # ユーザーがアプリ内から上書き更新できる編集可能なファイル群。
  # 実体はリポジトリ直下の pipeline/ ディレクトリ(packages/python-sidecar/
  # 配下ではない。runner.py の探索ロジック[_HERE.parent.parent / "pipeline"]
  # と一致させること)。
  - from: ../../pipeline
    to: pipeline-defaults
    filter: ["**/*"]

# ── Windows ──────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ── macOS ─────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build-resources/icon.icns
  category: public.app-category.graphics-design
  darkModeSupport: true

dmg:
  window:
    width: 540
    height: 380

# ── Linux ─────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build-resources/icon.png
  category: Graphics

# ── GitHub Releases への配布 ──────────────────────────────────────
# GH_TOKEN (= GITHUB_TOKEN) が必要。
# electron-builder がリポジトリを git remote から自動検出する。

publish:
  provider: github
  releaseType: release
